{% extends 'base.html' %}

{% block head %}
<title>Valentine's day app</title>
{% endblock %}

{% block body %}
<div class="content">
    <div class="decor-hearts" aria-hidden="true">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <h1 class="hero-title">
        <span class="script-title">For My Love</span>
        Reasons Why I Love My Wife
    </h1>


    <section class="reason-card">
        {% if reason %}
        <p class="reason-text">{{ reason.content }}</p>
        {% else %}
        <p class="empty-message">No reasons available yet. Add one from the admin page.</p>
        {% endif %}
    </section>

    <div class="actions">
        <form action="/">
            <input type="submit" value="Show another reason">
        </form>
        <!-- {% if reason %}
        <a class="link-btn delete" href="/delete/{{ reason.id }}">Delete this reason</a>
        {% endif %} -->
    </div>

    <!-- <a class="admin-link" href="/admin">Open admin</a> -->
</div>
{% endblock %}
