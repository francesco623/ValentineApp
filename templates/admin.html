{% extends 'base.html' %}

{% block head %}
<title>Admin | Valentine's day app</title>
{% endblock %}

{% block body %}
<div class="admincontent">
    <div class="decor-hearts" aria-hidden="true">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <h1 class="admin-title">
        <span class="script-title">Love Notes</span>
        Add a New Reason
    </h1>
    <p class="subtitle">Write a new reason and keep the list growing.</p>

    <form class="admin-form" action="/admin" method="POST">
        <input type="text" name="reason" id="reason" placeholder="Write a lovely reason..." required>
        <input type="submit" value="Add reason">
    </form>
    <a class="admin-link" href="/">Back to random reason</a>
</div>
{% endblock %}
